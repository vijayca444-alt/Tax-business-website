
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client Document Upload | TAXPERTIZE</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px 16px;
      font-family: Arial, sans-serif;
      background: #f3f6fa;
      color: #17304d;
    }
    .container {
      max-width: 560px;
      margin: 30px auto;
      padding: 28px;
      background: white;
      border-radius: 14px;
      box-shadow: 0 5px 24px #102b4812;
    }
    h1 { color: #082b50; margin-top: 0; }
    p { color: #596b7d; line-height: 1.5; }
    label {
      display: block;
      margin: 17px 0 7px;
      font-weight: 600;
    }
    input, select {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccd6e0;
      border-radius: 7px;
      font-size: 15px;
    }
    button {
      width: 100%;
      margin-top: 24px;
      padding: 14px;
      border: 0;
      border-radius: 7px;
      background: #082b50;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: wait; }
    #message { margin-top: 16px; font-weight: 600; }
    .note { font-size: 12px; }
  </style>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</head>
<body>
  <main class="container">
    <h1>TAXPERTIZE</h1>
    <h2>Client Document Upload</h2>
    <p>Submit your documents securely for Income Tax or GST services.</p>

    <form id="uploadForm">
      <label for="client_type">Client Type</label>
      <select id="client_type" name="client_type" required>
        <option value="">Select client type</option>
        <option>New Client</option>
        <option>Existing Client</option>
      </select>

      <label for="name">Name / Nickname</label>
      <input id="name" name="name" required maxlength="80" placeholder="Enter your name">

      <label for="mobile">Mobile Number</label>
      <input id="mobile" name="mobile" type="tel" inputmode="numeric" required placeholder="10-digit mobile number">

      <label for="pan">PAN Number</label>
      <input id="pan" name="pan" required maxlength="10" placeholder="ABCDE1234F" style="text-transform:uppercase">

      <label for="service">Service Required</label>
      <select id="service" name="service" required>
        <option value="">Select service</option>
        <option>Income Tax</option>
        <option>GST</option>
      </select>

      <label for="files">Upload Documents</label>
      <input id="files" name="files" type="file" multiple required accept=".pdf,.jpg,.jpeg,.png,.doc,.docx,.xls,.xlsx">
      <p class="note">Maximum 10 files, 10 MB each. PDF, images and Office documents accepted.</p>

      <div class="cf-turnstile"
        data-sitekey="PASTE_YOUR_CLOUDFLARE_SITE_KEY_HERE"></div>

      <button id="submitButton" type="submit">Submit Documents</button>
      <div id="message" role="status"></div>
    </form>
  </main>

  <script>
    const form = document.getElementById("uploadForm");
    const button = document.getElementById("submitButton");
    const message = document.getElementById("message");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      message.textContent = "";

      if (!form.reportValidity()) return;

      const token = window.turnstile?.getResponse();
      if (!token) {
        message.textContent = "Please complete the security check.";
        return;
      }

      const data = new FormData(form);
      data.append("turnstile_token", token);

      button.disabled = true;
      button.textContent = "Uploading...";

      try {
        const response = await fetch(
          "https://pwoffzunrhbxizdmthik.supabase.co/functions/v1/submit-client-documents",
          { method: "POST", body: data }
        );

        const result = await response.json();

        if (!response.ok) throw new Error(result.message || "Upload failed.");

        message.textContent = result.message;
        form.reset();
        window.turnstile.reset();
      } catch (error) {
        message.textContent = error.message || "Something went wrong.";
      } finally {
        button.disabled = false;
        button.textContent = "Submit Documents";
      }
    });
  </script>
</body>
</html>
