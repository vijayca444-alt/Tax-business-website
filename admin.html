
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TAXPERTIZE | Admin Dashboard</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6fa;
      color: #202938;
    }
    header {
      background: #142b4a;
      color: white;
      padding: 22px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }
    header h2 { margin: 0; }
    main {
      max-width: 1200px;
      margin: 30px auto;
      padding: 15px;
    }
    .panel {
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 3px 15px #0000000d;
      margin-bottom: 20px;
    }
    input, select, button {
      padding: 12px;
      border: 1px solid #ccd3dd;
      border-radius: 7px;
      font-size: 15px;
    }
    input, select { width: 100%; margin: 8px 0; }
    button {
      background: #1459a6;
      color: white;
      border: none;
      cursor: pointer;
    }
    button:hover { background: #0d407b; }
    .logout { background: #bd3030; }
    .filters {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 12px;
    }
    .table-wrap { overflow-x: auto; }
    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 850px;
    }
    th, td {
      text-align: left;
      padding: 13px;
      border-bottom: 1px solid #e5e8ed;
      vertical-align: top;
    }
    th { background: #edf2f8; }
    .download {
      display: inline-block;
      margin: 4px;
      padding: 7px 10px;
      background: #16834a;
      color: white;
      text-decoration: none;
      border-radius: 5px;
      font-size: 13px;
    }
    .hidden { display: none; }
    #message { margin-top: 12px; color: #bd3030; }
    .stats { font-size: 18px; font-weight: bold; }
    @media(max-width:600px) {
      .filters { grid-template-columns: 1fr; }
      .panel { padding: 16px; }
    }
  </style>
</head>

<body>

<header>
  <h2>TAXPERTIZE Admin Dashboard</h2>
  <button id="logoutBtn" class="logout hidden">Logout</button>
</header>

<main>

  <section id="loginPanel" class="panel">
    <h2>Admin Login</h2>
    <p>Login to view customer submissions.</p>

    <form id="loginForm">
      <input
        type="email"
        id="email"
        placeholder="Admin email"
        value="vijay.edukula@gmail.com"
        required
      >

      <input
        type="password"
        id="password"
        placeholder="Password"
        required
      >

      <button type="submit">Login</button>
    </form>

    <p id="loginMessage"></p>
  </section>

  <section id="dashboard" class="hidden">

    <div class="panel">
      <h2>Customer Submissions</h2>
      <p class="stats" id="totalCount">Total submissions: 0</p>

      <div class="filters">
        <input
          type="text"
          id="search"
          placeholder="Search name, mobile or PAN"
        >

        <select id="serviceFilter">
          <option value="">All Services</option>
          <option value="Income Tax">Income Tax</option>
          <option value="GST">GST</option>
        </select>
      </div>

      <button onclick="loadSubmissions()">Refresh Records</button>
      <p id="dashboardMessage"></p>
    </div>

    <div class="panel table-wrap">
      <table>
        <thead>
          <tr>
            <th>Date</th>
            <th>Client Type</th>
            <th>Name</th>
            <th>Mobile</th>
            <th>PAN</th>
            <th>Service</th>
            <th>Status</th>
            <th>Documents</th>
          </tr>
        </thead>
        <tbody id="records"></tbody>
      </table>
    </div>

  </section>

</main>

<script>
  const SUPABASE_URL =
    "https://pwoffzunrhbxizdmthik.supabase.co";

  // Replace this with your Supabase publishable key.
  const SUPABASE_KEY = "sb_publishable_nsDpIssE-J4S3pIQ2hLbHw_Ofvh5jci";

  const db = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  let submissions = [];

  const loginPanel = document.getElementById("loginPanel");
  const dashboard = document.getElementById("dashboard");
  const logoutBtn = document.getElementById("logoutBtn");

  function escapeHTML(value) {
    return String(value ?? "").replace(/[&<>"']/g, char => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    })[char]);
  }

  function showDashboard() {
    loginPanel.classList.add("hidden");
    dashboard.classList.remove("hidden");
    logoutBtn.classList.remove("hidden");
    loadSubmissions();
  }

  function showLogin() {
    loginPanel.classList.remove("hidden");
    dashboard.classList.add("hidden");
    logoutBtn.classList.add("hidden");
  }

  document.getElementById("loginForm").addEventListener(
    "submit",
    async (event) => {
      event.preventDefault();

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      const { error } = await db.auth.signInWithPassword({
        email,
        password
      });

      if (error) {
        document.getElementById("loginMessage").textContent =
          error.message;
        return;
      }

      document.getElementById("loginMessage").textContent = "";
      showDashboard();
    }
  );

  logoutBtn.addEventListener("click", async () => {
    await db.auth.signOut();
    showLogin();
  });

  async function loadSubmissions() {
    const message = document.getElementById("dashboardMessage");
    message.textContent = "Loading submissions...";

    const { data, error } = await db
      .from("client_submissions")
      .select("*")
      .order("created_at", { ascending: false });

    if (error) {
      message.textContent = "Could not load records: " + error.message;
      return;
    }

    submissions = data || [];
    message.textContent = "";
    renderRecords();
  }

  function renderRecords() {
    const search = document.getElementById("search")
      .value.trim().toLowerCase();

    const service = document.getElementById("serviceFilter").value;

    const filtered = submissions.filter(item => {
      const matchesSearch = [
        item.name,
        item.mobile,
        item.pan
      ].some(value =>
        String(value || "").toLowerCase().includes(search)
      );

      const matchesService =
        !service || item.service === service;

      return matchesSearch && matchesService;
    });

    document.getElementById("totalCount").textContent =
      "Total submissions: " + submissions.length;

    const tbody = document.getElementById("records");

    tbody.innerHTML = filtered.map(item => {
      const paths = Array.isArray(item.file_paths)
        ? item.file_paths
        : [];

      const downloads = paths.map((path, index) => `
        <button
          type="button"
          class="download"
          onclick="downloadDocument('${encodeURIComponent(path)}')"
        >
          Download ${index + 1}
        </button>
      `).join("");

      return `
        <tr>
          <td>${escapeHTML(new Date(item.created_at).toLocaleString())}</td>
          <td>${escapeHTML(item.client_type)}</td>
          <td>${escapeHTML(item.name)}</td>
          <td>${escapeHTML(item.mobile)}</td>
          <td>${escapeHTML(item.pan)}</td>
          <td>${escapeHTML(item.service)}</td>
         <td>
  <select onchange="updateStatus('${item.id}', this.value)">
    <option value="Pending" ${item.status === "Pending" ? "selected" : ""}>Pending</option>
    <option value="In Progress" ${item.status === "In Progress" ? "selected" : ""}>In Progress</option>
    <option value="Completed" ${item.status === "Completed" ? "selected" : ""}>Completed</option>
  </select>
</td>
          <td>${downloads || "No documents"}</td>
        </tr>
      `;
    }).join("");

    if (!filtered.length) {
      tbody.innerHTML =
        '<tr><td colspan="8">No matching submissions found.</td></tr>';
    }
  }

  async function downloadDocument(encodedPath) {
    const path = decodeURIComponent(encodedPath);

    const { data, error } = await db.storage
      .from("client-documents")
      .download(path);

    if (error) {
      alert("Download failed: " + error.message);
      return;
    }

    const url = URL.createObjectURL(data);
    const link = document.createElement("a");

    link.href = url;
    link.download = path.split("/").pop() || "document";

    document.body.appendChild(link);
    link.click();
    link.remove();

    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  document.getElementById("search")
    .addEventListener("input", renderRecords);

  document.getElementById("serviceFilter")
    .addEventListener("change", renderRecords);
  async function updateStatus(id, status) {
  const allowed = ["Pending", "In Progress", "Completed"];

  if (!allowed.includes(status)) return;

  const { error } = await db
    .from("client_submissions")
    .update({ status })
    .eq("id", id);

  if (error) {
    alert("Could not update status: " + error.message);
    loadSubmissions();
    return;
  }

  alert("Customer status updated successfully!");
}

  async function initialize() {
    const { data } = await db.auth.getSession();

    if (data.session) {
      showDashboard();
    } else {
      showLogin();
    }
  }

  initialize();
</script>

</body>
</html>
